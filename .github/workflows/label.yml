name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum

      - name: Build
        working-directory: api
        run: go build ./...

      - name: Vet
        working-directory: api
        run: go vet ./...

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest

    env:
      GO_API_URL: http://localhost:8080
      ACCESS_TOKEN_SECRET: dummy-secret
      KAKAO_REST_API_KEY: dummy
      KAKAO_REDIRECT_URI: http://localhost/callback
      KAKAO_CLIENT_SECRET: dummy
      NAVER_CLIENT_ID: dummy
      NAVER_CLIENT_SECRET: dummy
      NAVER_REDIRECT_URI: http://localhost/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type & Svelte check
        working-directory: web
        run: npm run check

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build